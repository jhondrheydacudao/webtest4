<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeStream - Intelligent Sync Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; }
        .anime-card:hover .play-btn { opacity: 1; transform: scale(1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="bg-[#111827] border-b border-gray-800 sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <a href="#" onclick="loadDashboard()" class="text-2xl font-bold text-violet-500 tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-circle-play"></i> AnimeStream
            </a>
            <form id="searchForm" class="relative w-full md:w-96">
                <input type="text" id="searchInput" placeholder="Search anime..." 
                    class="w-full bg-[#1f2937] text-white pl-10 pr-4 py-2 rounded-full border border-gray-700 focus:outline-none focus:border-violet-500 transition">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-gray-400"></i>
            </form>
        </div>
    </nav>

    <!-- Filter Bar Component -->
    <div class="bg-[#0f172a] border-b border-gray-800/60 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center gap-4 text-sm">
            <span class="text-gray-400 font-medium flex items-center gap-1.5"><i class="fa-solid fa-sliders text-violet-400"></i> Filter By:</span>
            
            <select id="genreFilter" onchange="handleGenreFilter()" class="bg-[#1f2937] text-gray-200 border border-gray-700 rounded-lg px-3 py-1.5 focus:outline-none focus:border-violet-500">
                <option value="">All Genres</option>
                <option value="action">Action</option>
                <option value="romance">Romance</option>
                <option value="comedy">Comedy</option>
                <option value="drama">Drama</option>
                <option value="fantasy">Fantasy</option>
                <option value="adventure">Adventure</option>
                <option value="supernatural">Supernatural</option>
                <option value="sci-fi">Sci-Fi</option>
            </select>

            <select id="seasonFilter" onchange="handleSeasonFilter()" class="bg-[#1f2937] text-gray-200 border border-gray-700 rounded-lg px-3 py-1.5 focus:outline-none focus:border-violet-500">
                <option value="">All Seasons</option>
                <option value="spring">Spring</option>
                <option value="summer">Summer</option>
                <option value="fall">Fall</option>
                <option value="winter">Winter</option>
            </select>

            <button onclick="resetFiltersAndDashboard()" class="text-xs bg-gray-800 hover:bg-gray-700 text-gray-300 px-2.5 py-1.5 rounded-md transition ml-auto">
                Reset Dashboard
            </button>
        </div>
    </div>

    <!-- Main Viewport -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Global Loading Spinner -->
        <div id="loading" class="hidden flex justify-center items-center h-64">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-violet-500"></div>
        </div>

        <!-- Dashboard View -->
        <div id="homeView" class="space-y-12">
            <!-- Popular Episodes Section -->
            <div id="popularSection">
                <h2 class="text-2xl font-bold mb-6 text-white border-l-4 border-amber-500 pl-3 flex items-center gap-2">
                    <i class="fa-solid fa-fire text-amber-500"></i> Hot Popular Episodes
                </h2>
                <div id="popularGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
            </div>

            <!-- Trending Shows Section -->
            <div id="trendingSection">
                <h2 class="text-2xl font-bold mb-6 text-white border-l-4 border-violet-500 pl-3">Trending Shows</h2>
                <div id="trendingGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
            </div>

            <!-- Latest Releases Section -->
            <div id="latestSection">
                <h2 class="text-2xl font-bold mb-6 text-white border-l-4 border-fuchsia-500 pl-3">Latest Releases</h2>
                <div id="latestGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
            </div>
        </div>

        <!-- Dynamic Results View -->
        <div id="filterResultsView" class="hidden">
            <h2 id="filterResultsTitle" class="text-2xl font-bold mb-6 text-white border-l-4 border-blue-500 pl-3">Filtered Content</h2>
            <div id="filterResultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        </div>

        <!-- Dedicated Player Workspace -->
        <div id="detailView" class="hidden">
            <button onclick="backToBrowsing()" class="mb-6 bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition text-sm">
                <i class="fa-solid fa-arrow-left"></i> Back to Catalog
            </button>
            
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Video Panel -->
                <div class="lg:col-span-2 space-y-4">
                    <div class="relative aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-gray-800 flex items-center justify-center">
                        <iframe id="videoIframe" src="" class="absolute top-0 left-0 w-full h-full hidden" allowfullscreen allow="autoplay; encrypted-media" frameborder="0"></iframe>
                        
                        <div id="playerPlaceholder" class="text-center p-4">
                            <i class="fa-solid fa-clapperboard text-5xl text-gray-600 mb-2 animate-pulse"></i>
                            <p class="text-gray-400">Select an episode to begin streaming</p>
                        </div>
                    </div>

                    <!-- Video Controls -->
                    <div class="bg-[#111827] border border-gray-800 p-4 rounded-xl flex flex-wrap items-center justify-between gap-4">
                        <div class="max-w-md">
                            <h1 id="animeTitle" class="text-xl font-bold text-white truncate">Loading Anime...</h1>
                            <p id="currentEpisodeLabel" class="text-sm text-violet-400 mt-0.5">No Episode Selected</p>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Source:</span>
                            <select id="serverSelect" onchange="switchServer()" class="bg-[#1f2937] text-white text-sm py-1.5 px-3 rounded-lg border border-gray-700 focus:outline-none focus:border-violet-500">
                                <option value="">Loading mirrors...</option>
                            </select>
                        </div>
                    </div>

                    <!-- Description Area -->
                    <div class="bg-[#111827] border border-gray-800 p-4 rounded-xl">
                        <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-2">Synopsis</h3>
                        <p id="animeDescription" class="text-sm text-gray-300 leading-relaxed">No description available.</p>
                    </div>
                </div>

                <!-- Sidebar Navigation Panel -->
                <div class="bg-[#111827] p-4 rounded-xl border border-gray-800 h-[520px] flex flex-col">
                    <div class="border-b border-gray-800 pb-3 mb-3">
                        <h3 class="text-lg font-bold text-white flex items-center gap-2">
                            <i class="fa-solid fa-list-ol text-violet-500"></i> Video Navigation
                        </h3>
                    </div>
                    
                    <div class="flex gap-2 mb-4">
                        <button id="prevEpBtn" onclick="playAdjacentEpisode('prev')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white py-2 px-3 rounded-lg text-xs font-medium transition disabled:opacity-40 disabled:cursor-not-allowed">
                            <i class="fa-solid fa-backward mr-1"></i> Prev Episode
                        </button>
                        <button id="nextEpBtn" onclick="playAdjacentEpisode('next')" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white py-2 px-3 rounded-lg text-xs font-medium transition disabled:opacity-40 disabled:cursor-not-allowed">
                            Next Episode <i class="fa-solid fa-forward ml-1"></i>
                        </button>
                    </div>

                    <div class="border-b border-gray-800 pb-2 mb-2">
                        <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Episode Timeline List</span>
                    </div>
                    <div id="episodeList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = 'https://anime2928.vercel.app';
        let currentEmbeds = [];
        let viewingState = 'dashboard';
        
        let nextEpisodeSlug = null;
        let prevEpisodeSlug = null;

        const homeView = document.getElementById('homeView');
        const filterResultsView = document.getElementById('filterResultsView');
        const detailView = document.getElementById('detailView');
        
        const popularGrid = document.getElementById('popularGrid');
        const trendingGrid = document.getElementById('trendingGrid');
        const latestGrid = document.getElementById('latestGrid');
        const filterResultsGrid = document.getElementById('filterResultsGrid');
        const filterResultsTitle = document.getElementById('filterResultsTitle');
        const loading = document.getElementById('loading');
        
        const genreFilter = document.getElementById('genreFilter');
        const seasonFilter = document.getElementById('seasonFilter');
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const videoIframe = document.getElementById('videoIframe');
        const playerPlaceholder = document.getElementById('playerPlaceholder');
        const serverSelect = document.getElementById('serverSelect');
        const animeDescription = document.getElementById('animeDescription');

        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (searchInput.value.trim()) handleSearch(searchInput.value.trim());
            });
        });

        function showLoading(isLoading) {
            loading.classList.toggle('hidden', !isLoading);
            if(isLoading) { 
                homeView.classList.add('hidden'); 
                filterResultsView.classList.add('hidden'); 
                detailView.classList.add('hidden'); 
            }
        }

        function extractSlug(url, fallbackSlug) {
            if (!url) return fallbackSlug;
            const cleaned = url.replace(/\/$/, ''); 
            return cleaned.substring(cleaned.lastIndexOf('/') + 1);
        }

        async function loadDashboard() {
            showLoading(true);
            viewingState = 'dashboard';
            filterResultsView.classList.add('hidden');
            detailView.classList.add('hidden');
            
            popularGrid.innerHTML = '';
            trendingGrid.innerHTML = '';
            latestGrid.innerHTML = '';

            try {
                const [popRes, homeRes, latestRes] = await Promise.all([
                    fetch(`${API_BASE}/popular`),
                    fetch(`${API_BASE}/home`),
                    fetch(`${API_BASE}/latest`)
                ]);

                const popData = await popRes.json();
                const homeData = await homeRes.json();
                const latestData = await latestRes.json();

                const popularEpisodes = popData.results || popData;
                const trendingItems = homeData.results || homeData.popular || homeData;
                const latestItems = latestData.results || latestData.latest || latestData;

                homeView.classList.remove('hidden');

                // Render Popular EPISODES
                if (Array.isArray(popularEpisodes)) {
                    popularGrid.innerHTML = popularEpisodes.map(item => {
                        const title = item.title || "Unknown Episode";
                        const img = item.thumbnail || item.poster || "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300";
                        const epSlug = extractSlug(item.url, item.id);
                        return `
                            <div onclick="resolveAndPlayPopularEpisode('${epSlug}')" class="anime-card bg-[#111827] rounded-xl overflow-hidden border border-gray-800 hover:border-amber-500/50 transition duration-300 cursor-pointer shadow-lg group">
                                <div class="relative aspect-[3/4] overflow-hidden bg-gray-900">
                                    <img src="${img}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                                    <div class="play-btn absolute inset-0 bg-black/70 flex items-center justify-center opacity-0 scale-90 transition duration-300">
                                        <i class="fa-solid fa-circle-play text-3xl text-white bg-amber-500 p-4 rounded-full shadow-lg"></i>
                                    </div>
                                </div>
                                <div class="p-3"><h3 class="font-semibold text-sm line-clamp-2 text-amber-400 group-hover:text-amber-300 transition">${title}</h3></div>
                            </div>`;
                    }).join('');
                }

                if (Array.isArray(trendingItems)) trendingGrid.innerHTML = generateCardsHtml(trendingItems);
                if (Array.isArray(latestItems)) latestGrid.innerHTML = generateCardsHtml(latestItems);

            } catch (err) {
                console.error(err);
                homeView.classList.remove('hidden');
            } finally { showLoading(false); }
        }

        // USES THE /parse/{slug} ENDPOINT TO RESOLVE PARENT METRICS FOR INDIVIDUAL EPISODES
        async function resolveAndPlayPopularEpisode(episodeSlug) {
            showLoading(true);
            try {
                const res = await fetch(`${API_BASE}/parse/${episodeSlug}`);
                const data = await res.json();
                
                // Extract structural data returned from your parser configuration
                // If it returns parent slug data under an anime or show key, use it. Otherwise, fall back gracefully
                const parentAnimeSlug = data.anime_slug || data.slug || data.parent_slug || episodeSlug.split('-episode-')[0];
                
                // Hand-off control cleanly to full details renderer to assemble the matching workspace
                await loadAnimeDetails(parentAnimeSlug);
                
                // Immediately pick and highlight the specific target popular episode inside the listing pane
                const targetBtn = document.getElementById(`btn-${episodeSlug}`);
                if(targetBtn) {
                    targetBtn.click();
                    targetBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    // Fallback to fetch raw stream directly if out of auto-gen bounds
                    playEpisode(episodeSlug, "Popular Stream Profile", null);
                }
            } catch(e) {
                console.error("Parser resolution failed:", e);
                // Last ditch recovery effort: try launching the stream blindly
                homeView.classList.add('hidden');
                detailView.classList.remove('hidden');
                resetPlayer();
                playEpisode(episodeSlug, "Direct Stream", null);
            } finally {
                loading.classList.add('hidden');
            }
        }

        async function handleGenreFilter() {
            const genre = genreFilter.value;
            if (!genre) return;
            seasonFilter.value = ""; searchInput.value = "";
            showLoading(true); viewingState = 'filtered'; filterResultsGrid.innerHTML = '';
            filterResultsTitle.innerText = `Genre: ${genre.charAt(0).toUpperCase() + genre.slice(1)}`;

            try {
                const res = await fetch(`${API_BASE}/genre/${genre}`);
                const data = await res.json();
                const items = data.results || data;
                filterResultsView.classList.remove('hidden');
                if (Array.isArray(items) && items.length > 0) filterResultsGrid.innerHTML = generateCardsHtml(items);
            } catch (err) { console.error(err); } finally { showLoading(false); }
        }

        async function handleSeasonFilter() {
            const season = seasonFilter.value;
            if (!season) return;
            genreFilter.value = ""; searchInput.value = "";
            showLoading(true); viewingState = 'filtered'; filterResultsGrid.innerHTML = '';
            filterResultsTitle.innerText = `Season: ${season.charAt(0).toUpperCase() + season.slice(1)}`;

            try {
                const res = await fetch(`${API_BASE}/season/${season}`);
                const data = await res.json();
                const items = data.results || data;
                filterResultsView.classList.remove('hidden');
                if (Array.isArray(items) && items.length > 0) filterResultsGrid.innerHTML = generateCardsHtml(items);
            } catch (err) { console.error(err); } finally { showLoading(false); }
        }

        async function handleSearch(query) {
            genreFilter.value = ""; seasonFilter.value = "";
            showLoading(true); viewingState = 'filtered'; filterResultsGrid.innerHTML = '';
            filterResultsTitle.innerText = `Search Results for "${query}"`;

            try {
                const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                const items = data.results || data;
                filterResultsView.classList.remove('hidden');
                if (Array.isArray(items) && items.length > 0) filterResultsGrid.innerHTML = generateCardsHtml(items);
            } catch (err) { console.error(err); } finally { showLoading(false); }
        }

        function generateCardsHtml(items) {
            return items.map(item => {
                const title = item.title || "Untitled Show";
                const img = item.poster || item.thumbnail || item.image || "https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300";
                const slug = extractSlug(item.url, item.slug || item.id);
                return `
                    <div onclick="loadAnimeDetails('${slug}')" class="anime-card bg-[#111827] rounded-xl overflow-hidden border border-gray-800 hover:border-violet-500/50 transition duration-300 cursor-pointer shadow-lg group">
                        <div class="relative aspect-[3/4] overflow-hidden bg-gray-900">
                            <img src="${img}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                            <div class="play-btn absolute inset-0 bg-black/70 flex items-center justify-center opacity-0 scale-90 transition duration-300">
                                <i class="fa-solid fa-play text-3xl text-white bg-violet-600 p-4 rounded-full shadow-lg"></i>
                            </div>
                        </div>
                        <div class="p-3"><h3 class="font-semibold text-sm line-clamp-2 text-gray-200 group-hover:text-violet-400 transition">${title}</h3></div>
                    </div>`;
            }).join('');
        }

        async function loadAnimeDetails(slug) {
            showLoading(true);
            resetPlayer();
            try {
                const res = await fetch(`${API_BASE}/anime/${slug}`);
                const data = await res.json();

                document.getElementById('animeTitle').innerText = data.title || slug.replace(/-/g, ' ');
                animeDescription.innerText = data.description || "No synopsis recorded.";
                detailView.classList.remove('hidden');

                let episodes = data.episodes || [];
                
                if (episodes.length === 0) {
                    for (let i = 1; i <= 24; i++) {
                        const epSlug = `${slug}-episode-${i}-english-subbed`;
                        episodes.push({ title: `Episode ${i}`, slug: epSlug });
                    }
                }

                document.getElementById('episodeList').innerHTML = episodes.map((ep, idx) => `
                    <button id="btn-${ep.slug}" onclick="playEpisode('${ep.slug}', '${ep.title}', this)" 
                        class="ep-btn w-full text-left bg-[#1f2937] hover:bg-gray-700 text-gray-200 px-3 py-2.5 rounded-lg text-sm transition flex justify-between items-center group border border-transparent">
                        <span class="truncate font-medium">${ep.title}</span>
                        <i class="fa-solid fa-circle-play text-xs text-gray-500 group-hover:text-violet-400 transition"></i>
                    </button>
                `).join('');

            } catch (err) {
                console.error(err);
                alert("Failed to gather stream profiles from the API.");
            } finally { showLoading(false); }
        }

        async function playEpisode(episodeSlug, episodeTitle, buttonElement) {
            document.querySelectorAll('.ep-btn').forEach(btn => btn.classList.remove('bg-violet-600', 'border-violet-400', 'text-white'));
            if(buttonElement) buttonElement.classList.add('bg-violet-600', 'border-violet-400', 'text-white');

            document.getElementById('currentEpisodeLabel').innerText = episodeTitle;
            setPlayerMessage('<i class="fa-solid fa-spinner animate-spin text-3xl mb-2 text-violet-500"></i><p>Scraping video embed url...</p>');

            try {
                const res = await fetch(`${API_BASE}/episode/${episodeSlug}`);
                const data = await res.json();

                serverSelect.innerHTML = '';
                currentEmbeds = data.embeds || [];

                if(data.navigation) {
                    prevEpisodeSlug = data.navigation.previous ? extractSlug(data.navigation.previous, null) : null;
                    nextEpisodeSlug = data.navigation.next ? extractSlug(data.navigation.next, null) : null;
                } else {
                    prevEpisodeSlug = null; nextEpisodeSlug = null;
                }

                document.getElementById('prevEpBtn').disabled = !prevEpisodeSlug;
                document.getElementById('nextEpBtn').disabled = !nextEpisodeSlug;

                if (currentEmbeds.length > 0) {
                    serverSelect.innerHTML = currentEmbeds.map((emb, idx) => `
                        <option value="${idx}">${emb.type ? emb.type.toUpperCase() : 'Mirror'} ${idx + 1}</option>
                    `).join('');
                    
                    renderEmbed(currentEmbeds[0].src);
                } else {
                    setPlayerMessage('<i class="fa-solid fa-circle-exclamation text-3xl text-red-500 mb-2"></i><p>No video player sources found.</p>');
                }
            } catch (err) {
                console.error(err);
                setPlayerMessage('<i class="fa-solid fa-triangle-exclamation text-3xl text-red-500 mb-2"></i><p>Streaming resource failed to respond.</p>');
            }
        }

        function playAdjacentEpisode(direction) {
            const targetSlug = direction === 'next' ? nextEpisodeSlug : prevEpisodeSlug;
            if(!targetSlug) return;

            const trackingBtn = document.getElementById(`btn-${targetSlug}`);
            let titleLabel = direction === 'next' ? "Next Episode" : "Previous Episode";
            
            if(trackingBtn) {
                trackingBtn.click();
                trackingBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else {
                playEpisode(targetSlug, titleLabel, null);
            }
        }

        function switchServer() {
            const index = serverSelect.value;
            if (currentEmbeds[index]) renderEmbed(currentEmbeds[index].src);
        }

        function renderEmbed(srcUrl) {
            if (!srcUrl) return;
            videoIframe.src = "";
            playerPlaceholder.classList.add('hidden');
            videoIframe.classList.remove('hidden');
            videoIframe.src = srcUrl;
        }

        function setPlayerMessage(htmlContent) {
            playerPlaceholder.innerHTML = htmlContent;
            playerPlaceholder.classList.remove('hidden');
            videoIframe.classList.add('hidden');
        }

        function resetFiltersAndDashboard() {
            genreFilter.value = ""; seasonFilter.value = ""; searchInput.value = "";
            loadDashboard();
        }

        function backToBrowsing() {
            detailView.classList.add('hidden');
            videoIframe.src = "";
            if (viewingState === 'filtered') filterResultsView.classList.remove('hidden');
            else homeView.classList.remove('hidden');
        }

        function resetPlayer() {
            videoIframe.src = "";
            prevEpisodeSlug = null; nextEpisodeSlug = null;
            document.getElementById('prevEpBtn').disabled = true;
            document.getElementById('nextEpBtn').disabled = true;
            serverSelect.innerHTML = '<option value="">Default Player</option>';
            setPlayerMessage('<i class="fa-solid fa-clapperboard text-5xl text-gray-600 mb-2 animate-pulse"></i><p>Select an episode to begin streaming</p>');
        }
    </script>
</body>
</html>
